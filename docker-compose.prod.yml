services:
  postgres:
    image: postgres:16-alpine
    container_name: leadspace-postgres
    restart: unless-stopped
    # 3.6G 同机多服务：限制库内存，避免导入/查询把整机拖死
    mem_limit: 768m
    memswap_limit: 768m
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=40
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leadspace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-leadspace}
    volumes:
      - leadspace_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-leadspace} -d ${POSTGRES_DB:-leadspace}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: leadspace-alipay-app
    restart: unless-stopped
    # 同机多服务：略提高上限，降低看板并发加载时 OOM→502 概率
    mem_limit: 2048m
    memswap_limit: 2048m
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      # 关单现场图；重建容器不丢
      - leadspace_n7_photos:/app/data/n7-follow-up
      - leadspace_xlv_photos:/app/data/xlv-follow-up
    environment:
      NODE_ENV: production
      # 先于系统 OOM 触发 V8 回收，降低整机假死概率
      NODE_OPTIONS: --max-old-space-size=1536
      # 容器内 /tmp 可写；任务结束后删文件，无需持久卷
      IMPORT_JOB_DIR: /tmp/leadspace-import-jobs
      N7_FOLLOW_UP_UPLOAD_DIR: /app/data/n7-follow-up
      XLV_FOLLOW_UP_UPLOAD_DIR: /app/data/xlv-follow-up
      DATABASE_URL: postgresql://${POSTGRES_USER:-leadspace}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-leadspace}?schema=public&connection_limit=10&pool_timeout=30
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      AUTH_URL: ${AUTH_URL:-https://ali.orblead.com}
      AUTH_TRUST_HOST: "true"
      # N7 关单外推企微群；未设置则跳过
      N7_OUTBOUND_WEBHOOK_URL: ${N7_OUTBOUND_WEBHOOK_URL:-}
      N7_PUBLIC_BASE_URL: ${N7_PUBLIC_BASE_URL:-${AUTH_URL:-https://ali.orblead.com}}
      # 小绿盒企微外推（关单 / 撤机 / 导入成功 → 业务群）；未设置则跳过
      XLV_OUTBOUND_WEBHOOK_URL: ${XLV_OUTBOUND_WEBHOOK_URL:-}
      XLV_PUBLIC_BASE_URL: ${XLV_PUBLIC_BASE_URL:-${AUTH_URL:-https://ali.orblead.com}}
      XLV_OPS_CRON_SECRET: ${XLV_OPS_CRON_SECRET:-}
      XLV_OPS_MEM_WARN_MB: ${XLV_OPS_MEM_WARN_MB:-1200}
      # 运维紧急告警 → 运维小群（不进业务群）
      OPS_ALERT_WEBHOOK_URL: ${OPS_ALERT_WEBHOOK_URL:-}
      # 可选：自建应用推个人（需企业可信 IP）
      WECOM_CORP_ID: ${WECOM_CORP_ID:-}
      WECOM_AGENT_ID: ${WECOM_AGENT_ID:-}
      WECOM_AGENT_SECRET: ${WECOM_AGENT_SECRET:-}
      WECOM_OPS_USERID: ${WECOM_OPS_USERID:-}

  db-init:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    profiles: ["init"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-leadspace}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-leadspace}?schema=public
      AUTH_URL: ${AUTH_URL:-https://ali.orblead.com}
      XLV_OUTBOUND_WEBHOOK_URL: ${XLV_OUTBOUND_WEBHOOK_URL:-}
      XLV_PUBLIC_BASE_URL: ${XLV_PUBLIC_BASE_URL:-${AUTH_URL:-https://ali.orblead.com}}
    restart: "no"

volumes:
  leadspace_pg_data:
  leadspace_n7_photos:
  leadspace_xlv_photos:
